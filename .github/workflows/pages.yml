name: Pages

# Keeps the gh-pages branch equal to docs/, which is what GitHub serves.
#
# The web exports themselves are committed under docs/ rather than produced
# here: a Godot web export needs the engine plus 1.3 GB of export templates, and
# making every deploy re-download them to rebuild bytes that are already known
# would be slower and far easier to break.
#
# docs/ holds one copy of the engine in docs/engine/ and a small directory per
# game. Every game exports a byte-identical 37 MB wasm, so sharing it means the
# second and third game a visitor opens start from the browser cache instead of
# downloading it again. See docs/engine/README.md.
#
# There is deliberately no actions/deploy-pages step. That route needs the Pages
# site to exist, creating one needs a permission the default Actions token does
# not have, and on a repository where Pages has never been switched on the job
# can only ever fail — leaving a red cross on every commit and publishing
# nothing. Serving a branch needs no setting changed and no permission granted.
#
# If you would rather publish through Actions, set Settings → Pages → Source to
# "GitHub Actions" and add the usual upload-pages-artifact / deploy-pages pair
# back; docs/ is already exactly the directory to upload.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror docs/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push docs/ as the gh-pages root
        run: |
          set -euo pipefail
          # The docs/ tree is already an object in this repository, so the
          # branch can be written with plumbing — no second checkout, no copy.
          tree="$(git rev-parse HEAD:docs)"
          if [ "$(git rev-parse --verify -q origin/gh-pages^{tree} || true)" = "$tree" ]; then
            echo "gh-pages already matches docs/, nothing to do"
            exit 0
          fi
          parent=""
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            parent="-p $(git rev-parse origin/gh-pages)"
          fi
          commit="$(git -c user.name=github-actions[bot] \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        commit-tree "$tree" $parent \
                        -m "Publish docs/ from ${GITHUB_SHA::12}")"
          git push origin "$commit:refs/heads/gh-pages"
          echo "gh-pages updated to $commit"
