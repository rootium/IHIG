name: Pages

# Publishes the Tessera web build.
#
# The export itself is committed under docs/ rather than produced here: a Godot
# web export needs the engine plus 1.3 GB of export templates, and making every
# deploy re-download them to rebuild bytes that are already known would be
# slower and far easier to break.
#
# There are two ways a repository can serve Pages and this workflow supports
# both, because which one is in effect is a repository setting rather than
# something a workflow can decide:
#
#   * Source "GitHub Actions" — the deploy job below publishes docs/ directly.
#   * Source "Deploy from a branch: gh-pages" — the mirror job keeps that
#     branch equal to docs/, and GitHub serves it.
#
# The deploy job is allowed to fail. Creating the Pages site needs a permission
# the default Actions token does not have, so on a repository where Pages has
# never been turned on it cannot succeed, and it should not take the mirror
# down with it.

on:
  push:
    branches:
      - claude/third-game-web-mobile-pc-jwz54o
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror docs/ to gh-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push docs/ as the gh-pages root
        run: |
          set -euo pipefail
          # The docs/ tree is already an object in this repository, so the
          # branch can be written with plumbing — no second checkout, no copy.
          tree="$(git rev-parse HEAD:docs)"
          if [ "$(git rev-parse --verify -q origin/gh-pages^{tree} || true)" = "$tree" ]; then
            echo "gh-pages already matches docs/, nothing to do"
            exit 0
          fi
          parent=""
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            parent="-p $(git rev-parse origin/gh-pages)"
          fi
          commit="$(git -c user.name=github-actions[bot] \
                        -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                        commit-tree "$tree" $parent \
                        -m "Publish docs/ from ${GITHUB_SHA::12}")"
          git push origin "$commit:refs/heads/gh-pages"

  deploy:
    name: Deploy via Pages
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: configure
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on where the token is allowed to. Where it is not, the
          # mirror job above is what makes the site work.
          enablement: true

      - name: Upload site
        if: steps.configure.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        if: steps.configure.outcome == 'success'
        uses: actions/deploy-pages@v4
