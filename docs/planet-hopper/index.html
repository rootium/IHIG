<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
	<meta name="theme-color" content="#0d1128">
	<meta name="description" content="Planet Hopper — an endless one-thumb orbit climber. Watch your fuel. Watch your air.">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>Planet Hopper</title>
	<style>
		:root {
			--void: #0d1128;
			--ink: #eef2ff;
			--dim: #7581a8;
			--accent: #5cc4e8;
			--fuel: #f5a86b;
			--oxy: #87cc87;
		}
		html, body { margin: 0; padding: 0; border: 0; height: 100%; }
		body {
			background: var(--void);
			color: var(--ink);
			overflow: hidden;
			touch-action: none;
			overscroll-behavior: none;
			font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		#canvas { display: block; width: 100%; height: 100%; }
		#canvas:focus { outline: none; }

		#boot {
			position: fixed; inset: 0; z-index: 10;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			gap: 1.1rem;
			background: radial-gradient(120% 90% at 50% 38%, #1a2148 0%, #0d1128 68%);
			transition: opacity .7s ease;
		}
		#boot.gone { opacity: 0; pointer-events: none; }

		#glyph { width: 190px; height: 190px; display: block; }

		#wordmark {
			font-size: clamp(1.6rem, 6.4vw, 2.7rem);
			letter-spacing: .3em;
			text-indent: .3em;
			font-weight: 500;
			margin: 0;
		}
		#tagline {
			color: var(--accent);
			font-size: clamp(.78rem, 2.9vw, 1rem);
			letter-spacing: .06em;
			margin: -.4rem 0 .3rem;
			text-align: center;
			padding: 0 1.2rem;
		}
		#bar {
			width: min(340px, 72vw); height: 3px;
			background: rgba(117, 129, 168, .22);
			border-radius: 2px; overflow: hidden;
		}
		#fill {
			height: 100%; width: 0%;
			background: linear-gradient(90deg, var(--fuel), var(--accent));
			transition: width .25s ease;
		}
		#note {
			color: var(--dim); font-size: .78rem; letter-spacing: .05em;
			min-height: 1.2em; text-align: center; padding: 0 1.5rem;
		}
		#fail {
			display: none; max-width: 34rem; margin: 0 1.5rem; padding: 1rem 1.2rem;
			border: 1px solid #9b3943; background: #2a1620; border-radius: .5rem;
			color: #ffd8de; font-size: .85rem; line-height: 1.5; white-space: pre-wrap;
		}
		#keys {
			position: fixed; left: 0; right: 0; bottom: 1.1rem; z-index: 9;
			text-align: center; color: var(--dim); font-size: .74rem;
			letter-spacing: .09em; pointer-events: none;
			transition: opacity 1s ease;
		}
		#keys b { color: var(--accent); font-weight: 600; }
		#keys.gone { opacity: 0; }
		@media (max-width: 620px) { #keys { display: none; } }
		@media (prefers-reduced-motion: reduce) { #glyph { display: none; } }
	</style>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
	<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
	<noscript>Planet Hopper needs JavaScript.</noscript>

	<div id="boot">
		<canvas id="glyph" width="380" height="380"></canvas>
		<h1 id="wordmark">PLANET HOPPER</h1>
		<p id="tagline">hop from orbit to orbit, and keep climbing</p>
		<div id="bar"><div id="fill"></div></div>
		<div id="note">plotting the first orbit…</div>
		<div id="fail"></div>
	</div>

	<div id="keys">
		<b>click</b> to break orbit &nbsp;·&nbsp; <b>hold</b> to burn &nbsp;·&nbsp; watch the fuel, watch the air
	</div>

	<script>
	// The loading glyph is the core loop in miniature: settle into an orbit,
	// leave it on the tangent, coast, and catch the next world higher up. The
	// ship keeps climbing, so the animation scrolls downward forever.
	(function () {
		const cv = document.getElementById('glyph');
		if (!cv || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
		const ctx = cv.getContext('2d');
		const S = cv.width, h = S / 2;

		// Worlds are spaced up the column; the camera pans to follow the ship.
		const GAP = 150, R = 30;
		const worlds = [];
		for (let i = 0; i < 6; i++) {
			worlds.push({ y: -i * GAP, x: (i % 2 ? 1 : -1) * 42, oxy: i % 3 === 1 });
		}

		let t = 0;
		function frame() {
			t += 0.0045;
			const phase = t % 1;
			const idx = Math.floor(t) % worlds.length;
			const from = worlds[idx];
			const to = worlds[(idx + 1) % worlds.length];
			// A world's own y, unrolled so the column always climbs.
			const baseY = (i) => -(Math.floor(t) + i) * GAP;

			// Orbit for the first two thirds, then coast to the next world.
			let sx, sy;
			if (phase < 0.62) {
				const a = phase / 0.62 * Math.PI * 2.4;
				sx = from.x + Math.cos(a) * (R + 18);
				sy = baseY(0) + Math.sin(a) * (R + 18);
			} else {
				const f = (phase - 0.62) / 0.38;
				const e = f * f * (3 - 2 * f);
				sx = from.x + (to.x - from.x) * e;
				sy = baseY(0) + (baseY(1) - baseY(0)) * e;
			}
			const camY = sy;

			ctx.clearRect(0, 0, S, S);
			ctx.save();
			ctx.translate(h, h);

			for (let i = -1; i < 4; i++) {
				const w = worlds[((idx + i) % worlds.length + worlds.length) % worlds.length];
				const wy = baseY(i) - camY;
				if (wy < -h - 60 || wy > h + 60) continue;
				const col = w.oxy ? 'rgba(135,204,135,' : 'rgba(168,140,245,';
				ctx.fillStyle = col + '.16)';
				ctx.beginPath(); ctx.arc(w.x, wy, R * 1.5, 0, Math.PI * 2); ctx.fill();
				ctx.fillStyle = col + '.95)';
				ctx.beginPath(); ctx.arc(w.x, wy, R, 0, Math.PI * 2); ctx.fill();
				ctx.strokeStyle = 'rgba(92,196,232,.25)';
				ctx.setLineDash([4, 6]); ctx.lineWidth = 1.5;
				ctx.beginPath(); ctx.arc(w.x, wy, R + 18, 0, Math.PI * 2); ctx.stroke();
				ctx.setLineDash([]);
			}

			// The ship, nose along its own motion.
			const sxr = sx, syr = sy - camY;
			ctx.fillStyle = 'rgba(240,246,255,.98)';
			ctx.beginPath(); ctx.arc(sxr, syr, 5.5, 0, Math.PI * 2); ctx.fill();
			ctx.fillStyle = 'rgba(245,168,107,.6)';
			ctx.beginPath(); ctx.arc(sxr, syr + 9, 3.2, 0, Math.PI * 2); ctx.fill();
			ctx.restore();
			requestAnimationFrame(frame);
		}
		frame();
	}());
	</script>

	<script src="index.js"></script>
	<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":63784,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
// Every game in this repo exports the *same* 37 MB engine binary — the pck is
// the only part that differs (tens of kilobytes). So the wasm is served once
// from /engine and every game points at it: whichever game you open first pays
// for the engine, and the other two then start from the browser cache.
GODOT_CONFIG.mainPack = 'index.pck';
GODOT_CONFIG.executable = '../engine/godot';
if (GODOT_CONFIG.fileSizes && GODOT_CONFIG.fileSizes['index.wasm']) {
	GODOT_CONFIG.fileSizes['../engine/godot.wasm'] = GODOT_CONFIG.fileSizes['index.wasm'];
}
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const boot = document.getElementById('boot');
	const fill = document.getElementById('fill');
	const note = document.getElementById('note');
	const fail = document.getElementById('fail');
	const keys = document.getElementById('keys');

	let done = false;

	function fatal(err) {
		console.error(err);
		fail.style.display = 'block';
		fail.textContent = (err instanceof Error) ? err.message : String(err);
		note.textContent = 'the launch was scrubbed';
		done = true;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		fatal('This browser is missing features Planet Hopper needs:\n\n' + missing.join('\n')
			+ '\n\nA current Chrome, Edge, Firefox or Safari should work.');
		return;
	}

	// The engine is a large download the first time. Say so, rather than
	// leaving a bar that looks stuck.
	const hints = [
		'plotting the first orbit…',
		'this is a one-time download; it is cached after the first visit',
		'oxygen only refills around the green worlds',
	];
	let hint = 0;
	const cycle = setInterval(() => {
		if (done) { clearInterval(cycle); return; }
		hint = (hint + 1) % hints.length;
		note.textContent = hints[hint];
	}, 4200);

	engine.startGame({
		onProgress: function (current, total) {
			if (current > 0 && total > 0) {
				fill.style.width = Math.round(100 * current / total) + '%';
			}
		},
	}).then(() => {
		done = true;
		clearInterval(cycle);
		fill.style.width = '100%';
		boot.classList.add('gone');
		setTimeout(() => boot.remove(), 800);
		setTimeout(() => keys.classList.add('gone'), 9000);
		document.getElementById('canvas').focus();
	}, fatal);
}());
	</script>
</body>
</html>
