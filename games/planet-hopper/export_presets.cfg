[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../../build/planet-hopper.apk"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

gradle_build/use_gradle_build=false
package/unique_name="com.ihig.planethopper"
package/name="Planet Hopper"
package/signed=true
version/code=1
version/name="0.1.0"
; 64-bit only. It halves the APK, and 32-bit-only Android hardware predates
; 2016. Set armeabi-v7a=true if you need to support those devices.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*"
export_path="../../build/web-planet-hopper/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
; Threads need SharedArrayBuffer, which needs COOP/COEP response headers, which
; GitHub Pages cannot send. Building without them is what lets the same files
; drop straight onto Pages and work.
variant/thread_support=false
variant/extensions_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell="res://shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
# The generated service worker caches a hard-coded file list including
# index.wasm, which this build serves from ../engine instead. Rather than ship
# a worker that caches a 404, the PWA is off; the browser HTTP cache is what
# makes the shared engine fast on a second game anyway.
progressive_web_app/enabled=false
; Only meaningful with threads on, and it would have the service worker send
; isolation headers this build does not want.
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=3
progressive_web_app/orientation=2
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.051, 0.067, 0.157, 1)
